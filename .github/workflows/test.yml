name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both test jobs run inside the official Playwright image matching the
  # @playwright/test version in package-lock.json. The image ships the browsers
  # and their system deps, so the runner's OS doesn't matter (ubuntu-latest
  # moving to 26.04 broke `playwright install --with-deps`), and bumping
  # Playwright automatically picks the matching image. The screenshot
  # baselines are made in the same image (`make update-visual`).
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: v
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/common

      - name: Run Playwright tests
        run: npx playwright test --project=e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Screenshot tests (`tests/*.visual.ts`).
  visual:
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/common

      - name: Run screenshot tests
        run: npx playwright test --project=visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: playwright-report
          retention-days: 14
